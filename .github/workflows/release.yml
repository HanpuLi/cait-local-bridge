name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Existing vX.Y.Z tag to recover/publish; required when publish_pypi is enabled"
        required: false
        type: string
        default: ""
      publish_pypi:
        description: "Publish the existing tagged release to PyPI using Trusted Publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          python -m build
          python -m twine check dist/*
          shasum -a 256 dist/* > SHA256SUMS
      - name: Tag/version guard
        if: github.ref_type == 'tag' || inputs.release_ref != ''
        env:
          RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
        run: |
          python - <<'PY'
          import os, bridge
          tag = os.environ["RELEASE_REF"].rsplit("/", 1)[-1]
          expected = "v" + bridge.__version__
          if tag != expected:
              raise SystemExit(f"release ref {tag!r} does not match package {expected!r}")
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            dist/*
            SHA256SUMS
          if-no-files-found: error

  github-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  pypi:
    if: (github.ref_type == 'tag' || (inputs.publish_pypi == true && inputs.release_ref != '')) && vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download newly built distributions
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist-bundle
      - name: Stage newly built package files
        if: github.ref_type == 'tag'
        run: |
          mkdir -p dist
          cp dist-bundle/dist/* dist/
      - name: Download exact existing GitHub Release assets
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_REF" --repo "$GITHUB_REPOSITORY" \
            --pattern 'scoperail-*.whl' \
            --pattern 'scoperail-*.tar.gz' \
            --dir dist
          gh release download "$RELEASE_REF" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  mcp-registry:
    if: needs.pypi.result == 'success' && vars.MCP_REGISTRY_PUBLISH_ENABLED == 'true'
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.ref }}
      - name: Install MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version
      - name: Validate registry metadata
        run: ./mcp-publisher validate server.json
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish MCP Registry metadata
        run: ./mcp-publisher publish server.json
