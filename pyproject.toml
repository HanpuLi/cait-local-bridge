[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cait-local-bridge"
dynamic = ["version"]
description = "Local-first MCP execution bridge with explicit workspace capabilities, persistent shells, browser control and semantic macOS UI automation."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Hanpu Li" }]
keywords = ["mcp", "model-context-protocol", "macos", "automation", "accessibility", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "httpx>=0.28,<0.29",
  "mcp>=2.2,<3",
  "playwright>=1.63,<2",
  "pydantic>=2.13,<3",
  "starlette>=1.0,<2",
  "uvicorn>=0.53,<1",
  "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=11; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
  "build>=1.3",
  "twine>=6.2",
  "ruff>=0.13",
]

[project.scripts]
cait-local-bridge = "bridge.public_cli:main"
cait-local-bridge-stdio = "bridge.stdio:main"

[project.urls]
Homepage = "https://github.com/HanpuLi/cait-local-bridge"
Repository = "https://github.com/HanpuLi/cait-local-bridge"
Issues = "https://github.com/HanpuLi/cait-local-bridge/issues"
Security = "https://github.com/HanpuLi/cait-local-bridge/security/policy"

[tool.setuptools.dynamic]
version = { attr = "bridge.__version__" }

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.ruff]
target-version = "py312"
line-length = 120
